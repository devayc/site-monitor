<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг сайтов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">
                <i class="bi bi-activity"></i> Site Monitor
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary" id="last-update">Загрузка...</span>
                <button class="btn btn-sm btn-outline-light" onclick="refreshSites()" title="Обновить список">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button class="btn btn-sm btn-warning" onclick="checkAllSites()" id="check-all-btn" title="Проверить все сайты сейчас">
                    <i class="bi bi-lightning"></i> Проверить все
                </button>
                <a href="/add" class="btn btn-sm btn-primary">+ Добавить</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="sites-container" class="sites-list">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Загрузка сайтов...</p>
            </div>
        </div>
    </main>

    <!-- Модальное окно удаления -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Удалить сайт?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Вы уверены, что хотите удалить этот сайт из мониторинга?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать сайт</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="edit-form">
                    <div class="modal-body">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" id="edit-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL</label>
                            <input type="url" class="form-control" id="edit-url" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Ожидаемый статус</label>
                                <input type="number" class="form-control" id="edit-expected" value="200" min="100" max="599">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Интервал (сек)</label>
                                <input type="number" class="form-control" id="edit-interval" value="60" min="10">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email для уведомлений</label>
                            <input type="text" class="form-control" id="edit-emails" placeholder="через запятую">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
