<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить сайт — Site Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-activity"></i> Site Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Дашборд</a></li>
                    <li class="nav-item"><a class="nav-link" href="/add">Добавить сайт</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Добавить сайт для мониторинга</h4>
                    </div>
                    <div class="card-body">
                        <form id="add-form">
                            <div class="mb-3">
                                <label class="form-label">Название</label>
                                <input type="text" class="form-control" name="name" required placeholder="Мой сайт">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL</label>
                                <input type="url" class="form-control" name="url" required placeholder="https://example.com">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ожидаемый статус</label>
                                    <input type="number" class="form-control" name="expected_status" value="200" min="100" max="599">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Интервал проверки (сек)</label>
                                    <input type="number" class="form-control" name="check_interval" value="60" min="10">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email для уведомлений <small class="text-muted">(через запятую)</small></label>
                                <input type="text" class="form-control" name="notify_emails" placeholder="admin@example.com">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus"></i> Добавить
                            </button>
                            <a href="/" class="btn btn-outline-secondary">Отмена</a>
                        </form>
                        <div id="form-message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center text-muted">
            <small>Site Monitor &copy; 2026</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
